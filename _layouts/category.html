<!DOCTYPE html>
<html lang="ru">
  <head>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>

  <body class="home-body">

    <main class="home-page">
      <header>
        <a href="https://speakid.ru" class="logo-link">
          <img src="/blog/logo2.png" alt="SPEAKID Blog" class="logo">
        </a>
      </header>

      {% include breadcrumbs.html %}

      <section class="hero-section">
        <h1 class="hero-title">{{ page.title }}</h1>
        <p class="hero-subtitle">{{ page.description }}</p>
      </section>

      {% include category-nav.html %}

      <section class="articles-grid" id="articles-grid">
        {% include article-cards.html category=page.category %}
      </section>
    </main>

  </body>
</html>
